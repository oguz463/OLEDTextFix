name: build

# Builds OLEDTextFix.exe with MinGW-w64 on every push / pull request.
# A release is published automatically when:
#   - a v* tag is pushed, or
#   - main is pushed (or the workflow is run manually on main) and no release exists yet
#     for the version in the VERSION file.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build
        run: sh build.sh

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/OLEDTextFix
          cp OLEDTextFix.exe README.md LICENSE dist/OLEDTextFix/
          (cd dist && zip -r "OLEDTextFix-$TAG.zip" OLEDTextFix)
          echo "ZIP=dist/OLEDTextFix-$TAG.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: OLEDTextFix-${{ env.TAG }}
          path: ${{ env.ZIP }}

      - name: Check whether the release already exists
        id: rel
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: OLEDTextFix ${{ env.TAG }}
          files: ${{ env.ZIP }}
          generate_release_notes: true
